task_id: C3_IFNG_feedback_decision_v0
source_id: S01_bda_schmidt_ifng
title: Schmidt-family primary T-cell IFNG perturbation screen
classification:
  primary_class: C3_feedback_decision_agent
  scientific_decision_object: next_round_perturbation_selection
  autonomy_level: closed_loop_decision_maker
data:
  data_name: IFNG
  task_prompt: BioDiscoveryAgent_repo/datasets/task_prompts/IFNG.json
  candidate_table: PerturbTrace/tasks/c3_ifng_feedback_decision_v0/hidden/oracle_scores.csv
  hit_set: PerturbTrace/tasks/c3_ifng_feedback_decision_v0/hidden/hit_set.npy
  public_candidate_actions: PerturbTrace/tasks/c3_ifng_feedback_decision_v0/public/candidate_actions.csv
  public_task_brief: PerturbTrace/tasks/c3_ifng_feedback_decision_v0/public_task_brief.md
  full_provenance: PerturbTrace/tasks/c3_ifng_feedback_decision_v0/provenance/full_provenance.md
  candidate_id_column: action_id
  score_column: score
  raw_columns:
  - Gene
  - Score
  candidate_count_verified: 18418
  hit_count_verified: 920
  original_candidate_row_count: 18418
  source_files:
    original_candidate_table: BioDiscoveryAgent_repo/datasets/ground_truth_IFNG.csv
    original_hit_set: BioDiscoveryAgent_repo/datasets/topmovers_IFNG.npy
hidden_oracle:
  type: action_score_table
  default_hit_rule: top 5 percent by absolute score
  oracle_score: signed log-fold-change from local Score column
  dataset_identity_hidden: true
public_action_space:
  visibility: public_ids
  delivery: artifact_reference
task_semantics:
  agent_safe_brief: Select gene perturbations that strongly alter IFNG production
    in stimulated primary T cells.
  biological_system: stimulated human primary T cells
  perturbation_operation: gene loss of function / CRISPR-style perturbation
  action_type: gene
  readout: normalized IFNG production
  feedback_value: tested gene signed score and absolute effect
budget:
  rounds: 5
  batch_size: 128
  total_slots: 640
feedback_policies:
- true_feedback
- no_feedback
- random_feedback
metrics:
  primary:
  - top_effect_recall
  - auc_hdc
  - feedback_delta_auc
  process:
  - invalid_action_rate
  - duplicate_action_rate
  - parse_failure_count
  - batch_fill_failure_rate
  - trace_completeness
leakage_controls:
  oracle_mode: external_hidden_oracle
  forbidden_to_agent:
  - hidden/oracle_scores.csv
  - hidden/hit_set.npy
  - untested_scores
  - untested_ranks
  - hit_threshold
  - dataset_identity
  - source_result_table
  - other_systems_run_outputs
implementation_notes: Already used as the current pilot; keep dataset identity hidden
  from solver.
benchmark_selection:
  status: active
  rationale: BDA internal single-gene task
  updated_from_review: '2026-06-15'
  role: bda_internal_single_gene


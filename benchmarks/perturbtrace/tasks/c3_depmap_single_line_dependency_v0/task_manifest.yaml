public_action_space:
  visibility: public_ids
  delivery: artifact_reference
task_semantics:
  agent_safe_brief: Select gene knockouts likely to strongly reduce viability in a
    private cancer-cell context.
  biological_system: cancer cell-line panel
  perturbation_operation: gene knockout
  action_type: gene
  readout: gene dependency / fitness score
  feedback_value: tested gene dependency score in the hidden context
budget:
  rounds: 5
  batch_size: 128
  total_slots: 640
feedback_policies:
- true_feedback
- no_feedback
- random_feedback
metrics:

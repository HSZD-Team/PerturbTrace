  - hidden/hit_set.npy
  - source_id
  - dataset_identity
  - release_accession_or_result_handle
  - untested_scores
  - untested_ranks
  - hit_threshold
implementation_notes: Select one cell line or lineage contrast, hide context identity,
  and export Gene,Score.
benchmark_selection:
  status: active

task_id: C3_cell_painting_morphology_v0
source_id: S16_jump_cell_painting
title: JUMP Cell Painting perturbation morphology dataset
classification:
  primary_class: C3_feedback_decision_agent
  scientific_decision_object: next_round_perturbation_selection
  autonomy_level: closed_loop_decision_maker
data:
  data_name: S16_jump_cell_painting
  candidate_table: PerturbTrace/tasks/c3_cell_painting_morphology_v0/hidden/oracle_scores.csv
  hit_set: PerturbTrace/tasks/c3_cell_painting_morphology_v0/hidden/hit_set.npy
  public_candidate_actions: PerturbTrace/tasks/c3_cell_painting_morphology_v0/public/candidate_actions.csv
  public_task_brief: PerturbTrace/tasks/c3_cell_painting_morphology_v0/public_task_brief.md
  full_provenance: PerturbTrace/tasks/c3_cell_painting_morphology_v0/provenance/full_provenance.md
  candidate_id_column: action_id
  score_column: score
  candidate_count_verified: 7972
  hit_count_verified: 399
  normalization:
    input_table: PerturbTrace/data_sources/raw_external/S16_jump_cell_painting/jump_crispr_morphology_shift_50pc_gene_scores.csv
    matrix_mode: long
    context_key: JUMP_CRISPR_hidden_50pc_morphology_shift
    action_column: action_id
    score_column: score
    hit_column: ''
    score_sign: as_is
    hit_mode: top_abs_percent
    hit_percent: 5.0
    hit_threshold: null
hidden_oracle:
  type: action_score_table
  default_hit_rule: top perturbations by frozen morphology projection
  oracle_score: target-state similarity or morphology effect magnitude
  dataset_identity_hidden: true
public_action_space:
  visibility: public_ids
  delivery: artifact_reference
task_semantics:
  agent_safe_brief: Select perturbations likely to produce a private morphology phenotype.
  biological_system: image-profiled cell models
  perturbation_operation: compound or genetic perturbation
  action_type: compound_or_gene_perturbation
  readout: morphology feature vector
  feedback_value: tested perturbation morphology-projection score
budget:
  rounds: 5
  batch_size: 64
  total_slots: 320
feedback_policies:
- true_feedback
- no_feedback
- random_feedback
- stale_feedback
metrics:
  primary:
  - top_effect_recall
  - auc_hdc
  - feedback_delta_auc
  process:
  - invalid_action_rate
  - duplicate_action_rate
  - parse_failure_count
  - batch_fill_failure_rate
  - trace_completeness
leakage_controls:
  oracle_mode: external_hidden_oracle
  forbidden_to_agent:
  - hidden/oracle_scores.csv
  - hidden/hit_set.npy
  - source_id
  - dataset_identity
  - release_accession_or_result_handle
  - untested_scores
  - untested_ranks
  - hit_threshold
implementation_notes: Requires feature aggregation and target phenotype definition.
benchmark_selection:
  status: active
  rationale: included_or_accepted_in_review_feedback
  updated_from_review: '2026-06-15'
  role: review_specified


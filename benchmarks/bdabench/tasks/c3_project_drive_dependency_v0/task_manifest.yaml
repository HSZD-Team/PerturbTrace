task_id: C3_project_drive_dependency_v0
source_id: S11_project_drive_rnai
title: Project DRIVE large-scale cancer RNAi dependency screens
classification:
  primary_class: C3_feedback_decision_agent
  scientific_decision_object: next_round_perturbation_selection
  autonomy_level: closed_loop_decision_maker
data:
  data_name: S11_project_drive_rnai
  candidate_table: BDAbench/tasks/c3_project_drive_dependency_v0/hidden/oracle_scores.csv
  hit_set: BDAbench/tasks/c3_project_drive_dependency_v0/hidden/hit_set.npy
  public_candidate_actions: BDAbench/tasks/c3_project_drive_dependency_v0/public/candidate_actions.csv
  public_task_brief: BDAbench/tasks/c3_project_drive_dependency_v0/public_task_brief.md
  full_provenance: BDAbench/tasks/c3_project_drive_dependency_v0/provenance/full_provenance.md
  candidate_id_column: action_id
  score_column: score
  candidate_count_verified: 7975
  hit_count_verified: 399
  normalization:
    input_table: BDAbench/data_sources/raw_external/S11_project_drive_rnai/drive_demeter2_frozen_context_gene_dependency.csv
    matrix_mode: long
    context_key: SF295_CENTRAL_NERVOUS_SYSTEM
    action_column: gene
    score_column: score
    score_sign: negate
    hit_mode: top_score_percent
    hit_percent: 5.0
hidden_oracle:
  type: action_score_table
  default_hit_rule: strongest knockdown dependencies
  oracle_score: DEMETER-style or project dependency score
  dataset_identity_hidden: true
public_action_space:
  visibility: public_ids
  delivery: artifact_reference
task_semantics:
  agent_safe_brief: Select gene knockdowns likely to strongly reduce viability in
    a private cancer-cell context.
  biological_system: cancer cell-line panel
  perturbation_operation: gene knockdown
  action_type: gene
  readout: pooled shRNA dependency / viability score
  feedback_value: tested gene dependency score
budget:
  rounds: 5
  batch_size: 128
  total_slots: 640
feedback_policies:
- true_feedback
- no_feedback
- random_feedback
- stale_feedback
metrics:
  primary:
  - top_effect_recall
  - auc_hdc
  - feedback_delta_auc
  process:
  - invalid_action_rate
  - duplicate_action_rate
  - parse_failure_count
  - batch_fill_failure_rate
  - trace_completeness
leakage_controls:
  oracle_mode: external_hidden_oracle
  forbidden_to_agent:
  - hidden/oracle_scores.csv
  - hidden/hit_set.npy
  - source_id
  - dataset_identity
  - release_accession_or_result_handle
  - untested_scores
  - untested_ranks
  - hit_threshold
implementation_notes: Label modality clearly; do not mix with CRISPR-only leaderboard
  unless track permits RNAi.
benchmark_selection:
  status: active
  rationale: selected_ok_in_phenotype_availability_sheet
  updated_from_review: '2026-06-15'
  role: excel_ok


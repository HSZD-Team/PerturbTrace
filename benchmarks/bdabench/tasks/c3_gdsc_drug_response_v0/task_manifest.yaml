task_id: C3_gdsc_drug_response_v0
source_id: S14_gdsc
title: Genomics of Drug Sensitivity in Cancer drug response screens
classification:
  primary_class: C3_feedback_decision_agent
  scientific_decision_object: next_round_perturbation_selection
  autonomy_level: closed_loop_decision_maker
data:
  data_name: S14_gdsc
  candidate_table: BDAbench/tasks/c3_gdsc_drug_response_v0/hidden/oracle_scores.csv
  hit_set: BDAbench/tasks/c3_gdsc_drug_response_v0/hidden/hit_set.npy
  public_candidate_actions: BDAbench/tasks/c3_gdsc_drug_response_v0/public/candidate_actions.csv
  public_task_brief: BDAbench/tasks/c3_gdsc_drug_response_v0/public_task_brief.md
  full_provenance: BDAbench/tasks/c3_gdsc_drug_response_v0/provenance/full_provenance.md
  candidate_id_column: action_id
  score_column: score
  candidate_count_verified: 286
  hit_count_verified: 15
  normalization:
    input_table: BDAbench/data_sources/raw_external/S14_gdsc/gdsc2_sidm00136_drug_sensitivity_zscore.csv
    matrix_mode: long
    context_key: SIDM00136
    action_column: drug
    score_column: score
    score_sign: as_is
    hit_mode: top_score_percent
    hit_percent: 5.0
    score_definition: 该细胞系相对该药物全细胞系分布的敏感性z-score
    hit_threshold: null
hidden_oracle:
  type: action_score_table
  default_hit_rule: top drugs by hidden cell-line sensitivity z-score
  oracle_score: 该细胞系相对该药物全细胞系分布的敏感性z-score
  dataset_identity_hidden: true
public_action_space:
  visibility: public_ids
  delivery: inline_full
task_semantics:
  agent_safe_brief: Select drugs likely to strongly affect viability in a private
    cancer-cell context.
  biological_system: cancer cell-line panel
  perturbation_operation: small-molecule treatment
  action_type: drug
  readout: drug-wise cell-line sensitivity z-score
  feedback_value: tested drug sensitivity z-score
budget:
  rounds: 5
  batch_size: 32
  total_slots: 160
feedback_policies:
- true_feedback
- no_feedback
- random_feedback
- stale_feedback
metrics:
  primary:
  - top_effect_recall
  - auc_hdc
  - feedback_delta_auc
  process:
  - invalid_action_rate
  - duplicate_action_rate
  - parse_failure_count
  - batch_fill_failure_rate
  - trace_completeness
leakage_controls:
  oracle_mode: external_hidden_oracle
  forbidden_to_agent:
  - hidden/oracle_scores.csv
  - hidden/hit_set.npy
  - source_id
  - dataset_identity
  - release_accession_or_result_handle
  - untested_scores
  - untested_ranks
  - hit_threshold
implementation_notes: GDSC oracle score is the hidden cell line sensitivity z-score
  relative to the all-cell-line AUC distribution for each drug; higher is more sensitive.
benchmark_selection:
  status: active
  rationale: selected_ok_in_phenotype_availability_sheet
  updated_from_review: '2026-06-15'
  role: excel_ok


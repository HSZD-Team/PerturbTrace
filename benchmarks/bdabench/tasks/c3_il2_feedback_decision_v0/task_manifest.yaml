task_id: C3_IL2_feedback_decision_v0
source_id: S02_bda_schmidt_il2
title: Schmidt-family primary T-cell IL2 perturbation screen
classification:
  primary_class: C3_feedback_decision_agent
  scientific_decision_object: next_round_perturbation_selection
  autonomy_level: closed_loop_decision_maker
data:
  data_name: IL2
  task_prompt: BioDiscoveryAgent_repo/datasets/task_prompts/IL2.json
  candidate_table: BDAbench/tasks/c3_il2_feedback_decision_v0/hidden/oracle_scores.csv
  hit_set: BDAbench/tasks/c3_il2_feedback_decision_v0/hidden/hit_set.npy
  public_candidate_actions: BDAbench/tasks/c3_il2_feedback_decision_v0/public/candidate_actions.csv
  public_task_brief: BDAbench/tasks/c3_il2_feedback_decision_v0/public_task_brief.md
  full_provenance: BDAbench/tasks/c3_il2_feedback_decision_v0/provenance/full_provenance.md

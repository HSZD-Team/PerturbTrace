  score_column: score
  raw_columns:
  - Gene
  - Score
  candidate_count_verified: 18939
  hit_count_verified: 654
  original_candidate_row_count: 18939
  source_files:
    original_candidate_table: BioDiscoveryAgent_repo/datasets/ground_truth_IL2.csv
    original_hit_set: BioDiscoveryAgent_repo/datasets/topmovers_IL2.npy
hidden_oracle:
  type: action_score_table
  default_hit_rule: top 5 percent by absolute score
  oracle_score: signed log-fold-change from local Score column
  dataset_identity_hidden: true
public_action_space:
  visibility: public_ids
  delivery: artifact_reference
task_semantics:
  agent_safe_brief: Select gene perturbations that strongly alter IL2 production in
    stimulated primary T cells.
  biological_system: stimulated human primary T cells
  perturbation_operation: gene loss of function / CRISPR-style perturbation
  action_type: gene
  readout: normalized IL2 production
  feedback_value: tested gene signed score and absolute effect
budget:
  rounds: 5
  batch_size: 128
  total_slots: 640
feedback_policies:
- true_feedback
- no_feedback
- random_feedback
- stale_feedback
metrics:
  primary:
  - top_effect_recall
  - auc_hdc
  - feedback_delta_auc
  process:
  - invalid_action_rate
  - duplicate_action_rate
  - parse_failure_count
  - batch_fill_failure_rate
  - trace_completeness
leakage_controls:
  oracle_mode: external_hidden_oracle
  forbidden_to_agent:
  - hidden/oracle_scores.csv
  - hidden/hit_set.npy
  - untested_scores
  - untested_ranks
  - hit_threshold
  - dataset_identity
  - source_result_table
  - other_systems_run_outputs
implementation_notes: Clone IFNG manifest but change readout semantics and local oracle
  files.
benchmark_selection:
  status: active
  rationale: BDA internal single-gene task
  updated_from_review: '2026-06-15'
  role: bda_internal_single_gene


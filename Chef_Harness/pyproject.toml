[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chef-harness"
version = "0.1.0"
description = "Chef_Harness — local skill launcher for PerturbTrace / BDAbench evals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
chef = "chef_harness.cli:main"

[tool.setuptools.packages.find]
include = ["chef_harness*"]
